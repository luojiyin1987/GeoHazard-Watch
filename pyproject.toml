[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geohazard-watch"
version = "0.1.0"
description = "Public-data geohazard monitoring experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "netCDF4>=1.7,<2",
  "numpy>=2,<3",
  "planetary-computer>=1,<2",
  "pystac-client>=0.8,<1",
  "rasterio>=1.4,<2",
]

[project.scripts]
geohazard-watch = "geohazard_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geohazard_watch"]
